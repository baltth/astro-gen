# Sketch 'db' - list of sketches
#
# Add items with add.py script of github.com/baltth/astro-gen or manually.
#
# Content of entries:
# 'full': file name of full sketch page [string]
# 'scan': file name of the original scanned image, optional [list of strings]
# 'sub': list of files cut out of the full page, optional [list of strings]
# 'notes': sketch notes, optional [string]
# '_cmd': commands for generating the files, optional [list of strings]

sketches:
  - full: 2026/c47-alpha-umi-20260816.jpg
    scan: 2026/cluster_double_star.jpg
    sub:
      - 2026/c47-20260816.jpg
      - 2026/alpha-umi-20260816.jpg
    _cmd:
      - ./script/astro_gen.py ./example add -i ./example/orig/cluster_double_star_inv.jpg -c ./example/orig/cluster_double_star.jpg -x 65 -y 170 -o1 C47 -o2 
        'Alpha UMi'

  - full: 2026/c-2025-r3-alpha-umi-20260816.jpg
    scan: 2026/comet_double_star.jpg
    sub:
      - 2026/c-2025-r3-20260816.jpg
      - 2026/alpha-umi-20260816-2.jpg
    _cmd:
      - astro-gen ./example add -i ./example/orig/comet_double_star_inv.jpg -c ./example/orig/comet_double_star.jpg -x 65 -y 170 -o1 'C/2025 R3' -o2 'Alpha UMi'
        --new
    notes: |
      [sketch notes]

  - full: 2026/gassendi-archimedes-20260816.jpg
    scan: 2026/craters.jpg
    sub:
      - 2026/gassendi-20260816.jpg
      - 2026/archimedes-20260816.jpg
    _cmd:
      - ./script/astro_gen.py ./example add -i ./example/orig/craters.jpg -c ./example/orig/craters.jpg -x 65 -y 170 -o1 Gassendi -o2 Archimedes

  - full: 2026/m31-saturn-20260816.jpg
    scan: 2026/galaxy_planet.jpg
    sub:
      - 2026/m31-20260816.jpg
      - 2026/saturn-20260816.jpg
    _cmd:
      - ./script/astro_gen.py ./example add -i ./example/orig/galaxy_planet_inv.jpg -c ./example/orig/galaxy_planet.jpg -x 65 -y 170 -o1 M31 -o2 Saturn
